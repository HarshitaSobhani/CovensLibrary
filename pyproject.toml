[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["accounts", "core", "audit", "members", "catalogue", "config"]
omit = ["*/migrations/*", "*/tests/*"]
