[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# long SQL / embedded script lines in the privilege tests are clearer unwrapped
"core/tests/test_runtime_privileges.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["accounts", "core", "audit", "members", "catalogue", "finance", "memberships", "config"]
omit = ["*/migrations/*", "*/tests/*"]
