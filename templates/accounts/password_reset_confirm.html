{% extends "base.html" %}{% block heading %}Choose a new password{% endblock %}
{% block content %}<div class="card-surface" style="max-width:26rem;margin:2rem auto">
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn-primary-token" type="submit">Set password</button></form>
{% else %}<p>This reset link is invalid or has expired.</p><a href="{% url 'accounts:password_reset' %}">Request a new link</a>{% endif %}</div>{% endblock %}
