{% extends "base.html" %}{% block heading %}Reset password{% endblock %}
{% block content %}<div class="card-surface" style="max-width:26rem;margin:2rem auto">
<p>Enter the owner's email address. If it matches, a reset link is sent. If email is unavailable, use local recovery (see operator guide).</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn-primary-token" type="submit">Send reset link</button></form>
<p class="mt-3"><a href="{% url 'accounts:recover' %}">Use a recovery code</a></p></div>{% endblock %}
